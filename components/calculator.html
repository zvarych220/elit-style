<section class="calc" id="calc">
  <div class="wrap box">
    <div>
      <h2>Порахуйте орієнтовну вартість</h2>
      <p class="lead">Оберіть тип стелі та площу — отримаєте мінімальну ціну полотна з монтажем.</p>
      <div class="row">
        <div>
          <label for="ctype">Тип стелі</label>
          <select id="ctype"></select>
        </div>
        <div>
          <label for="carea">Площа, кв.м</label>
          <input id="carea" type="number" min="1" max="500" value="20" inputmode="decimal">
        </div>
      </div>
    </div>
    <div class="res">
      <div>Орієнтовно від</div>
      <div class="sum" id="csum">8 000 грн</div>
      <small>Остаточна ціна — після заміру, зі знижкою за акцією</small>
      <a class="btn" href="#order">Зафіксувати ціну</a>
    </div>
  </div>
</section>
